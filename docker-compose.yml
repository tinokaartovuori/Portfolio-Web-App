# One Droplet: the app behind Caddy, which takes care of the certificate.
# Needs a .env with DOMAIN and NUXT_STATS_KEY (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NUXT_STATS_KEY: ${NUXT_STATS_KEY:?set NUXT_STATS_KEY in .env}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?set NUXT_PUBLIC_SITE_URL in .env}
    volumes:
      - data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3 is UDP; without this Compose maps 443 as TCP only and QUIC
      # never reaches the container
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
